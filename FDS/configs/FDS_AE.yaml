  Ny: 31
  Nt: 120
  dx: 1.0
  dy: 1.0
  dt: 15
  x_slice: 1
  y_slice: 1
  t_slice: 1
  physics normalisation: False

Model:
  arch: 'AE'
  in_vars: 3
  out_vars: 1
  conds: 3
  activation: 'relu'

Data: 
  # name: 'FDS_Carpark_temp_time_average.npy'
