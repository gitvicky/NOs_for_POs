
seed: 907

Physics: 
  pde: 'Incomp. Navier-Stokes'
  source: 'PDEBench'
  field: 'u, v'
  variables: 2 
  Nx: 128
  Ny: 128
  Nt: 100
  rollout: 'RK4'
  physics normalisation: False

Model:
  arch: 'FNO'
  modes: 8
  width: 16
  act: 'gelu'
  operator splitting: False

Data: 
  name: 'NS_incomp_velocity_100_128_128.npy'
  loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Code/NOs_for_POs/Data'
  ntrain: 100
  test-train-split: 0.2
  batch size: 1
  t_in: 1
  t_out: 50
  step: 1
  normalisation: 'Min-Max'

Opt:
  optimizer: 'adam'
  epochs: 500
  learning rate: 0.005
  beta1: 0.9
  beta2: 0.9
  weight_decay: 1e-4
  scheduler: 'step'  
  scheduler step : 100
  scheduler gamma: 0.5
  grad_clip: 2.0

Train: 
  loss: 'LP'
  rollout: True
  checkpoint:
    epochs: 100
  restart: False
  restart run name: '' #simvue run name 

Simvue:
  mode: 'online'
  name: None 
  folder: '/Neural_PDE/tests' 
