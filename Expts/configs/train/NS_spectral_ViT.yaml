
seed: 'random'

Physics: 
  pde: 'Navier-Stokes'
  source: 'Spectral' 
  field: 'u, v'
  variables: 2
  Nx: 100
  Ny: 100
  Nt: 100
  dx: 0.01
  dy: 0.01
  dt: 0.01
  x_slice: 1
  y_slice: 1
  t_slice: 1
  physics_normalisation: False

Model:
  arch: 'ViT'
  patch_size: 4
  embed_dim: 512
  in_vars: 2
  out_vars: 2
  time_channels: 1
  depth: 12
  num_heads: 10
  operator_splitting: True
  ops_split_normalise: False

Data: 
  name: 'NS_Spectral_combined.npz'
  loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Code/Neural_PDE/Data'
  ntrain: 100
  test_train_split: 0.2
  batch_size: 20
  t_in: 1
  t_out: 50
  step: 1
  normalisation: 'Min-Max'


Opt:
  optimizer: 'adam'
  epochs: 250
  learning_rate: 0.005
  beta1: 0.9
  beta2: 0.9
  weight_decay: 1e-4
  scheduler: 'step'  
  scheduler_step: 100
  scheduler_gamma: 0.5
  grad_clip: 2.0

Train: 
  loss: 'LP'
  input_length: 1
  rollout_length: 5
  input_noise: 0.0
  odesolve: 
    source: 'custom' #'torchdiffeq', 'custom'
    method: 'euler' # 'AR', 'euler', 'midpoint', rk4'
    adjoint: False #Only for torchdiffeq
  batch_norm: False
  checkpoint:
    epochs: 100
  restart: False
  restart_run_name: '' #simvue run name
  finetune: False
  finetune_run_name: 'happy-ray' 

Simvue:
  mode: 'online'
  name: None 
  folder: '/Neural_PDE/Spectral' 
  tags: 'ErrorBars'
