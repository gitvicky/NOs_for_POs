seed: 907

Physics: 
  pde: 'FDS'
  source: 'Finite Volume' 
  field: 'T'
  variables: 5 #Floors
  Nx: 250
  Ny: 74
  Nt: 120
  dx: 1.0
  dy: 1.0
  dt: 15
  x_slice: 1
  y_slice: 1
  t_slice: 2
  physics normalisation: False

Model:
  arch: 'FNO'
  in_vars: 5
  out_vars: 5
  modes_x: 16
  modes_y: 16
  width: 32
  n_layers: 6
  act: 'gelu'
  operator splitting: False
  ops_split norm: False


Data: 
  name: 'FDS_Carpark_temp_time_average.npy'
  loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Code/NOs_for_POs/Data'
  ntrain: 50
  test-train-split: 0.0
  batch size: 20
  t_in: 1
  t_out: 60
  step: 1
  normalisation: 'Min-Max_variable'

Opt:
  optimizer: 'adam'
  epochs: 500
  learning rate: 0.005
  beta1: 0.9
  beta2: 0.9
  weight_decay: 1e-4
  scheduler: 'step'  
  scheduler step : 100
  scheduler gamma: 0.5
  grad_clip: 2.0

Train: 
  loss: 'LP'
  input_length: 1
  rollout_length: 2
  input_noise: 0.0
  odesolve: 
    source: 'custom' #'torchdiffeq', 'custom'
    method: 'AR' # 'AR', 'euler', 'midpoint', rk4'
    adjoint: False #Only for torchdiffeq
  batch_norm: False
  checkpoint:
    epochs: 100
  restart: False
  restart run name: '' #simvue run name 

Simvue:
  mode: 'online'
  name: None 
  folder: '/Neural_PDE/FDS' 
