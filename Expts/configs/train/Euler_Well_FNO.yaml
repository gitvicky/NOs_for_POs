#https://polymathic-ai.org/the_well/datasets/euler_multi_quadrants_periodicBC/
  seed: 907

  Physics: 
    pde: 'Euler Quadrant'
    source: 'The Well' 
    field: 'rho, E, px, py, P'
    variables: 5
    Nx: 512
    Ny: 512
    Nt: 101
    dx: 0.039
    dy: 0.019
    dt: 0.015
    x_slice: 4
    y_slice: 4
    t_slice: 1
    physics normalisation: False

  Model:
    arch: 'FNO'
    in_vars: 5
    out_vars: 5
    modes: 8
    width: 16
    n_layers: 4
    act: 'gelu'
    operator splitting: False
    ops_split normalise: False

  Data: 
    gamma: ['1.365'] 
    schmidt: ['Dry_air_1000'] 
    name: 'Euler Quadrant'
    loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Data/The_Well/datasets//euler_multi_quadrants_periodicBC/data/test'
    ntrain: 50
    test-train-split: 0.2
    batch size: 5
    t_in: 1
    t_out: 50
    step: 1
    normalisation: 'Min-Max'

  Opt:
    optimizer: 'adam'
    epochs: 500
    learning rate: 0.005
    beta1: 0.9
    beta2: 0.9
    weight_decay: 1e-4
    scheduler: 'step'  
    scheduler step : 100
    scheduler gamma: 0.5
    grad_clip: 2.0

  Train: 
    loss: 'LP'
    input_length: 1
    rollout_length: 20
    input_noise: 0.0
    odesolve: 
      source: 'custom' #'torchdiffeq', 'custom'
      method: 'euler' # 'AR', 'euler', 'midpoint', rk4'
      adjoint: False #Only for torchdiffeq
    batch_norm: False
    checkpoint:
      epochs: 100
    restart: False
    restart run name: '' #simvue run name 

  Simvue:
    mode: 'online'
    name: None 
    folder: '/Neural_PDE/NS_Shearflow' 
