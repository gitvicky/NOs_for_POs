seed: 907

Physics: 
  pde: 'Electrostatic MHD'
  source: 'JOREK' 
  field: 'rho, phi, T'
  variables: 3
  Nx: 100
  Ny: 100
  Nt: 100
  dx: 0.01
  dy: 0.01
  dt: 0.005 #1.5e-6 real time
  x_slice: 1
  y_slice: 1
  t_slice: 2
  physics_normalisation: True

Model:
  arch: 'FNO'
  in_vars: 3
  out_vars: 3
  modes: 8
  width: 16
  n_layers: 4
  act: 'gelu'
  operator_splitting: False
  ops_split_normalise: False

Data: 
  name: 'JOREK_filtered.npz'
  loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Code/NOs_for_POs/Data'
  ntrain: 500
  test_train_split: 0.2
  batch_size: 50
  t_in: 1
  t_out: 50
  step: 1
  normalisation: 'Min-Max_variable'

Opt:
  optimizer: 'adam'
  epochs: 500
  learning_rate: 0.005
  beta1: 0.9
  beta2: 0.9
  weight_decay: 1e-4
  scheduler: 'step'  
  scheduler_step: 100
  scheduler_gamma: 0.5
  grad_clip: 1.0

Train: 
  loss: 'LP'
  input_length: 1
  rollout_length: 20
  input_noise: 0.0
  odesolve: 
    source: 'custom' #'torchdiffeq', 'custom'
    method: 'euler' # 'AR', 'euler', 'midpoint', rk4'
    adjoint: False #Only for torchdiffeq
  batch_norm: False
  checkpoint:
    epochs: 100
  restart: False
  restart_run_name: '' #simvue run name

Simvue:
  mode: 'online'
  name: None 
  folder: '/Neural_PDE/ES_JOREK' 