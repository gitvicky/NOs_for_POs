seed: 907

Physics: 
  pde: 'Electrostatic MHD'
  source: 'JOREK' 
  field: 'rho, phi, T'
  variables: 3
  Nx: 100
  Ny: 100
  Nt: 100
  dt: 1.5e-6 x 10 #downsampled by 10
  physics normalisation: True

Model:
  arch: 'FNO'
  in_vars: 3
  out_vars: 3
  modes: 8
  width: 16
  n_layers: 6
  act: 'gelu'
  operator splitting: False

Data: 
  name: 'JOREK_filtered.npz'
  loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Code/NOs_for_POs/Data'
  ntrain: 100
  test-train-split: 0.2
  batch size: 50
  t_in: 1
  t_out: 100
  step: 1
  normalisation: 'Min-Max'

Opt:
  optimizer: 'adam'
  epochs: 500
  learning rate: 0.005
  beta1: 0.9
  beta2: 0.9
  weight_decay: 1e-4
  scheduler: 'step'  
  scheduler step : 100
  scheduler gamma: 0.5
  grad_clip: 2.0

Train: 
  loss: 'LP'
  input_length: 1
  rollout_length: 20
  odesolve: 
    source: 'custom' #'torchdiffeq', 'custom'
    method: 'AR' # 'AR', 'euler', 'midpoint', rk4'
    adjoint: False #Only for torchdiffeq
  checkpoint:
    epochs: 100
  restart: False
  restart run name: '' #simvue run name 

Simvue:
  mode: 'online'
  name: None 
  folder: '/Neural_PDE/ES_JOREK' 
