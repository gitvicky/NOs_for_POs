seed: 907

Physics: 
  pde: 'Constrained MHD'
  source: 'Finite-Volume' 
  field: 'rho, u, v, P, Bx, By'
  variables: 6
  Nx: 128
  Ny: 128
  Nt: 200
  dx: 0.0078125
  dy: 0.0078125
  dt: 0.0001 
  x_slice: 2
  y_slice: 2
  t_slice: 2
  physics_normalisation: False

Model:
  arch: 'FNO'
  in_vars: 6
  out_vars: 6
  modes: 32
  width: 64
  n_layers: 3
  act: 'gelu'
  operator_splitting: True
  ops_split_normalise: False

Data: 
  name: 'Constrained_MHD_combined.npz'
  loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Code/Neural_PDE/Data'
  ntrain: 100
  test_train_split: 0.2
  batch_size: 10
  t_in: 1
  t_out: 50
  step: 1
  normalisation: 'Min-Max_variable'

Opt:
  optimizer: 'adam'
  epochs: 250
  learning_rate: 0.005
  beta1: 0.9
  beta2: 0.9
  weight_decay: 1e-4
  scheduler: 'step'  
  scheduler_step: 50
  scheduler_gamma: 0.5
  grad_clip: 2.0

Train: 
  loss: 'LP'
  input_length: 1
  rollout_length: 5
  input_noise: 0.0
  odesolve: 
    source: 'custom' #'torchdiffeq', 'custom'
    method: 'euler' # 'AR', 'euler', 'midpoint', rk4'
    adjoint: False #Only for torchdiffeq
  batch_norm: False
  checkpoint:
    epochs: 100
  restart: False
  restart_run_name: '' #simvue run name

Simvue:
  mode: 'online'
  name: None 
  folder: '/Neural_PDE/Constrained_MHD' 