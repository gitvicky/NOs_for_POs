
  seed: 907

  Physics: 
    pde: 'Shear Flow'
    source: 'The Well' 
    field: 'u, v'
    variables: 2
    Nx: 256
    Ny: 512
    Nt: 200
    dx: 0.039
    dy: 0.019
    dt: 0.01
    x_slice: 2
    y_slice: 2
    t_slice: 2
    physics_normalisation: False

  Model:
    arch: 'FNO'
    in_vars: 2
    out_vars: 2
    modes: 8
    width: 16
    n_layers: 2
    act: 'gelu'
    operator_splitting: True
    ops_split_normalise: False

  Data: 
    loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Data/The_Well/datasets/shear_flow/data/train'
    reynolds: ['1e4'] 
    # schmidt: ['1e0', '1e-1', '1e1', '2e0', '2e-1', '5e0', '5e-1'] #test
    schmidt: ['1e-1', '1e1', '5e-1'] #train
    name: 'Shear Flow'
    ntrain: 96
    test_train_split: 0.2
    batch_size: 8
    t_in: 1
    t_out: 50
    step: 1
    normalisation: 'Min-Max'

  Opt:
    optimizer: 'adam'
    epochs: 250
    learning_rate: 0.005
    beta1: 0.9
    beta2: 0.9
    weight_decay: 1e-4
    scheduler: 'step'  
    scheduler_step: 50
    scheduler_gamma: 0.5
    grad_clip: 2.0

  Train: 
    loss: 'LP'
    input_length: 1
    rollout_length: 20
    input_noise: 0.0
    odesolve: 
      source: 'custom' #'torchdiffeq', 'custom'
      method: 'euler' # 'AR', 'euler', 'midpoint', rk4'
      adjoint: False #Only for torchdiffeq
    batch_norm: False
    checkpoint:
      epochs: 100
    restart: False
    restart_run_name: '' #simvue run name

  Simvue:
    mode: 'online'
    name: None 
    folder: '/Neural_PDE/NS_Shearflow' 
