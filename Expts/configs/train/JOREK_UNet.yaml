seed: 907

Physics: 
  pde: 'Electrostatic MHD'
  source: 'JOREK' 
  field: 'rho, phi, T'
  variables: 3
  Nx: 100
  Ny: 100
  Nt: 100
  dx: 0.01
  dy: 0.01
  dt: 0.005 #1.5e-6 real time
  x_slice: 1
  y_slice: 1
  t_slice: 1
  physics normalisation: True

Model:
  arch: 'U-Net'
  in_vars: 3
  out_vars: 3
  width: 32
  act: 'tanh'
  operator splitting: False
  ops_split normalise: False

Data: 
  name: 'JOREK_filtered.npz'
  loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Code/NOs_for_POs/Data'
  ntrain: 200
  test-train-split: 0.2
  batch size: 10
  t_in: 1
  t_out: 50
  step: 1
  normalisation: 'Min-Max_variable'

Opt:
  optimizer: 'adam'
  epochs: 500
  learning rate: 0.005
  beta1: 0.9
  beta2: 0.9
  weight_decay: 1e-4
  scheduler: 'step'  
  scheduler step : 100
  scheduler gamma: 0.5
  grad_clip: 2.0

Train: 
  loss: 'LP'
  input_length: 1
  rollout_length: 50
  input_noise: 0.0
  odesolve: 
    source: 'custom' #'torchdiffeq', 'custom'
    method: 'AR' # 'AR', 'euler', 'midpoint', rk4'
    adjoint: False #Only for torchdiffeq
  batch_norm: False
  checkpoint:
    epochs: 100
  restart: False
  restart run name: '' #simvue run name 

Simvue:
  mode: 'online'
  name: None 
  folder: '/Neural_PDE/ES_JOREK' 