
seed: 907

Physics: 
  pde: 'Navier-Stokes'
  operator: 'Convection'
  source: 'Spectral' 
  field: 'u, v'
  variables: 2
  Nx: 100
  Ny: 100
  Nt: 100
  dx: 0.01
  dy: 0.01
  dt: 0.01
  x_slice: 1
  y_slice: 1
  t_slice: 1
  physics normalisation: False

Model:
  arch: 'Matrix'
  in_vars: 2
  out_vars: 2
  n_layers: 1
  act: 'None'
  operator splitting: False

Data: 
  name: 'NS_Spectral_combined.npz'
  loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Code/Neural_PDE/Data'
  ntrain: 100
  test-train-split: 0.2
  batch size: 10
  t_in: 1
  t_out: 50
  step: 1
  normalisation: 'Min-Max'

Opt:
  optimizer: 'adam'
  epochs: 1000
  learning rate: 0.005
  beta1: 0.9
  beta2: 0.9
  weight_decay: 1e-4
  scheduler: 'step'  
  scheduler step : 100
  scheduler gamma: 0.5
  grad_clip: 2.0

Train: 
  loss: 'LP'
  input_length: None
  rollout_length: None
  input_noise: 0.0
  odesolve: 
    source: 'custom' #'torchdiffeq', 'custom'
    method: 'AR' # 'AR', 'euler', 'midpoint', rk4'
    adjoint: False #Only for torchdiffeq
  checkpoint:
    epochs: 100
  restart: False
  restart run name: '' #simvue run name 

Simvue:
  mode: 'online'
  name: None 
  folder: '/Neural_PDE/OpsLearn' 
