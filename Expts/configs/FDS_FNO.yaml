seed: 907

Physics: 
  pde: 'FDS'
  source: 'Finite Volume' 
  field: 'T'
  variables: 1
  Nx: 250
  Ny: 74
  Nt: 303
  dx: 0.4
  dy: 0.4
  dt: 0.008
  x_slice: 1
  y_slice: 1
  t_slice: 1
  physics normalisation: False

Model:
  arch: 'FNO'
  in_vars: 1
  out_vars: 1
  modes: 8
  width: 16
  n_layers: 4
  act: 'gelu'
  operator splitting: False


Data: 
  name: 'FDS_Carpark_test.npy'
  loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Code/NOs_for_POs/Data'
  ntrain: 100
  test-train-split: 0.2
  batch size: 100
  t_in: 1
  t_out: 300
  step: 1
  normalisation: 'Min-Max_variable'

Opt:
  optimizer: 'adam'
  epochs: 500
  learning rate: 0.005
  beta1: 0.9
  beta2: 0.9
  weight_decay: 1e-4
  scheduler: 'step'  
  scheduler step : 100
  scheduler gamma: 0.5
  grad_clip: 2.0

Train: 
  loss: 'LP'
  input_length: 1
  rollout_length: 1
  input_noise: 0.0
  odesolve: 
    source: 'custom' #'torchdiffeq', 'custom'
    method: 'AR' # 'AR', 'euler', 'midpoint', rk4'
    adjoint: False #Only for torchdiffeq
  batch_norm: False
  checkpoint:
    epochs: 100
  restart: False
  restart run name: '' #simvue run name 

Simvue:
  mode: 'online'
  name: None 
  folder: '/Neural_PDE/Euler' 
