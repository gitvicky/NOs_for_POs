
seed: 907

Physics: 
  pde: 'Comp. Navier-Stokes'
  source: 'PDEBench' 
  field: 'u, v, p, rho'
  variables: 4
  Nx: 128
  Ny: 128
  Nt: 21
  dt: 0.05
  physics normalisation: False

Model:
  arch: 'FNO'
  in_vars: 4
  out_vars: 4
  modes: 8
  width: 16
  n_layers: 6
  act: 'gelu'
  operator splitting: False

Data: 
  name: 'NS_incomp_velocity_100_128_128.npz'
  loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Code/NOs_for_POs/Data'
  ntrain: 100
  test-train-split: 0.2
  batch size: 20
  t_in: 1
  t_out: 21
  step: 1
  normalisation: 'Min-Max_variable'

Opt:
  optimizer: 'adam'
  epochs: 500
  learning rate: 0.005
  beta1: 0.9
  beta2: 0.9
  weight_decay: 1e-4
  scheduler: 'step'  
  scheduler step : 100
  scheduler gamma: 0.5
  grad_clip: 2.0

Train: 
  loss: 'LP'
  input_length: 1
  rollout_length: 10
  odesolve: 
    source: 'custom' #'torchdiffeq', 'custom'
    method: 'AR' # 'AR', 'euler', 'midpoint', rk4'
    adjoint: False #Only for torchdiffeq
  checkpoint:
    epochs: 100
  restart: False
  restart run name: '' #simvue run name 

Simvue:
  mode: 'online'
  name: None 
  folder: '/Neural_PDE/Incompressible_NS' 
