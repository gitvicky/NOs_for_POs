
  seed: 907

  Physics: 
    pde: 'Navier-Stokes'
    source: 'Shear Flow' 
    field: 'u, v'
    variables: 2
    Nx: 256
    Ny: 512
    Nt: 200
    dx: 0.003921569
    dy: 0.003921569
    dt: 0.1
    x_slice: 1
    y_slice: 1
    t_slice: 1
    physics normalisation: False

  Model:
    arch: 'FNO'
    in_vars: 2
    out_vars: 2
    modes: 8
    width: 16
    n_layers: 4
    act: 'gelu'
    operator splitting: True
    ops_split normalise: False

  Data: 
    name: 'Shear Flow'
    loc: '/home/ir-gopa2/rds/rds-ukaea-ap001/ir-gopa2/Data/The_Well/datasets/shear_flow/data/test'
    reynolds: '1e4'
    schmidt: '1e0'
    ntrain: 4
    test-train-split: 1.0
    batch size: 4
    t_in: 1
    t_out: 50
    step: 1
    normalisation: 'Min-Max'

  Opt:
    optimizer: 'adam'
    epochs: 500
    learning rate: 0.005
    beta1: 0.9
    beta2: 0.9
    weight_decay: 1e-4
    scheduler: 'step'  
    scheduler step : 100
    scheduler gamma: 0.5
    grad_clip: 2.0

  Train: 
    loss: 'LP'
    input_length: 1
    rollout_length: 20
    input_noise: 0.0
    odesolve: 
      source: 'custom' #'torchdiffeq', 'custom'
      method: 'euler' # 'AR', 'euler', 'midpoint', rk4'
      adjoint: False #Only for torchdiffeq
    batch_norm: False
    checkpoint:
      epochs: 100
    restart: False
    restart run name: '' #simvue run name 

  Simvue:
    mode: 'online'
    name: ''
    folder: '/Neural_PDE/NS_Shear_Flow' 
